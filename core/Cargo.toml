[package]
name = "agentmux-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared domain model for agentmux: projects, workspaces, agent profiles, sessions and events"

[dependencies]
agent-client-protocol = "0.10"
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "process", "rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }
portable-pty = "0.9"
vt100 = "0.16"
libc = "0.2"
base64 = "0.22"
vte = "0.15"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }
