name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      # `cargo test` builds the `agentmux-mock-agent` fixture itself via
      # `cargo build -p agentmux-mock-agent` (core/tests/common), so no
      # pre-build step is needed. Worktree tests create real git repos but
      # set repo-local `user.email`/`user.name`; pi-rpc tests need `python3`
      # (preinstalled on ubuntu-latest). No agent API keys are required.
      - name: test
        run: cargo test --workspace

  pty:
    name: terminal (PTY) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      # The runner's system Python is externally managed (PEP 668); a
      # setup-python interpreter takes the pinned terminal emulator.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyte
        run: python -m pip install pyte==0.8.2

      # Each script drives the real TUI binary in a PTY against an isolated
      # daemon + mock agent / fake Pi; no agent API keys are required.
      - name: Build binaries
        run: cargo build --workspace

      - name: PTY tests
        run: |
          status=0
          for test in tui/tests/*_pty.py; do
            echo "::group::$test"
            if ! timeout 600 python "$test"; then
              echo "::error file=$test::$test failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
