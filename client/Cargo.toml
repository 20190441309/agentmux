[package]
name = "agentmux-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Client SDK for the agentmux daemon: typed JSON-RPC calls over the unix socket, streamed session events, and daemon auto-start"

[dependencies]
agentmux-core = { path = "../core" }
# Socket-path resolution (AGENTMUX_SOCK / XDG defaults) is reused from the
# server crate so client and daemon can never disagree on where the
# socket lives.
agentmux-server = { path = "../server" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
