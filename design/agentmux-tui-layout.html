<style>
#agentmux-layout { --am-bg:light-dark(#faf9f6,#17191c); --am-panel:light-dark(#f0efeb,#1e2125); --am-input:light-dark(#eeede8,#22262b); --am-text:light-dark(#242a31,#d8dcd9); --am-dim:light-dark(#626b72,#9ba5ab); --am-line:light-dark(#d8d9d3,#343a40); --am-blue:light-dark(#346791,#92b6d2); --am-green:light-dark(#3d7150,#a0bda1); --am-yellow:light-dark(#87651f,#d9bb7b); --am-red:light-dark(#a54840,#dba097); --am-selected:light-dark(#e0e7eb,#2a3540); --am-side:270px; color:var(--am-text); font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace; container-type:inline-size; }
#agentmux-layout * { box-sizing:border-box; }
#agentmux-layout button, #agentmux-layout textarea { font:inherit; color:inherit; }
#agentmux-layout button { border:0; background:transparent; padding:3px 6px; text-align:left; border-radius:0; }
#agentmux-layout button:hover { background:var(--am-selected); }
#agentmux-layout button:disabled { opacity:.6; }
#agentmux-layout button[aria-pressed="true"] { color:var(--am-blue); background:var(--am-selected); }
#agentmux-layout .am-terminal { background:var(--am-bg); border:1px solid var(--am-line); min-height:690px; position:relative; }
#agentmux-layout .am-top { display:flex; align-items:center; flex-wrap:wrap; gap:10px; padding:12px 16px; border-bottom:1px solid var(--am-line); }
#agentmux-layout .am-brand { color:var(--am-blue); font-weight:500; letter-spacing:-.5px; }
#agentmux-layout .am-path, #agentmux-layout .am-muted { color:var(--am-dim); }
#agentmux-layout .am-top-actions { display:flex; gap:6px; margin-left:auto; align-items:center; }
#agentmux-layout .am-layout { display:grid; grid-template-columns:minmax(0,1fr) var(--am-side); min-height:608px; }
#agentmux-layout .am-main { padding:20px 24px 12px; min-width:0; display:flex; flex-direction:column; }
#agentmux-layout .am-title { font-size:16px; font-weight:500; }
#agentmux-layout .am-subtitle { display:flex; gap:10px; flex-wrap:wrap; margin-top:3px; color:var(--am-dim); font-size:12px; }
#agentmux-layout .am-tag { color:var(--am-yellow); }
#agentmux-layout .am-conversation { flex:1; padding-top:24px; min-width:0; }
#agentmux-layout .am-message { margin-bottom:18px; }
#agentmux-layout .am-message p { margin:5px 0 0; overflow-wrap:anywhere; }
#agentmux-layout .am-author { color:var(--am-blue); font-weight:500; }
#agentmux-layout .am-you { border-left:2px solid var(--am-line); padding:2px 0 2px 12px; }
#agentmux-layout .am-you .am-author { color:var(--am-dim); }
#agentmux-layout .am-tool { background:var(--am-panel); padding:5px 10px; margin:6px 0; }
#agentmux-layout .am-tool summary { cursor:default; color:var(--am-dim); overflow-wrap:anywhere; }
#agentmux-layout .am-tool summary:focus-visible { outline:2px solid var(--am-blue); }
#agentmux-layout .am-tool pre { margin:10px 0 4px; font:inherit; white-space:pre-wrap; overflow-wrap:anywhere; }
#agentmux-layout .am-plus { color:var(--am-green); }
#agentmux-layout .am-minus { color:var(--am-red); }
#agentmux-layout .am-working { color:var(--am-yellow); margin:14px 0 5px; }
#agentmux-layout .am-stream-foot { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--am-dim); font-size:12px; margin:10px 0; }
#agentmux-layout .am-composer { border-top:1px solid var(--am-blue); background:var(--am-input); padding:9px 12px; margin-top:12px; }
#agentmux-layout .am-recipient { font-size:12px; color:var(--am-blue); overflow-wrap:anywhere; }
#agentmux-layout textarea { display:block; resize:vertical; min-height:62px; width:100%; border:0; border-radius:0; background:transparent; margin:7px 0; padding:0; }
#agentmux-layout textarea::placeholder { color:var(--am-dim); }
#agentmux-layout .am-input-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:11px; color:var(--am-dim); }
#agentmux-layout .am-send { color:var(--am-blue); }
#agentmux-layout .am-reference { display:flex; gap:7px; align-items:center; font-size:12px; color:var(--am-blue); padding:6px 0 0; }
#agentmux-layout .am-reference span { flex:1; }
#agentmux-layout .am-side { background:var(--am-panel); padding:16px 14px; border-left:1px solid var(--am-line); min-width:0; }
#agentmux-layout .am-tabs { display:flex; justify-content:space-between; gap:4px; border-bottom:1px solid var(--am-line); padding-bottom:10px; margin-bottom:18px; }
#agentmux-layout .am-section-label { margin:16px 0 8px; color:var(--am-dim); font-size:12px; }
#agentmux-layout .am-task { display:block; width:100%; padding:9px 8px; margin:3px 0; }
#agentmux-layout .am-task[aria-pressed="true"] { color:var(--am-text); }
#agentmux-layout .am-task-title { display:flex; gap:7px; align-items:baseline; }
#agentmux-layout .am-task-sub { display:block; padding-left:19px; font-size:11px; color:var(--am-dim); }
#agentmux-layout .am-alert { border-top:1px solid var(--am-line); margin-top:26px; padding-top:12px; }
#agentmux-layout .am-alert button { color:var(--am-yellow); width:100%; }
#agentmux-layout .am-side-note { margin-top:26px; color:var(--am-dim); font-size:11px; overflow-wrap:anywhere; }
#agentmux-layout .am-file { display:block; width:100%; padding:9px 4px; border-bottom:1px solid var(--am-line); overflow-wrap:anywhere; }
#agentmux-layout .am-file span { display:block; color:var(--am-dim); font-size:11px; }
#agentmux-layout .am-context { overflow-wrap:anywhere; }
#agentmux-layout .am-context p { margin:4px 0 16px; }
#agentmux-layout .am-bottom { display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; padding:8px 16px; border-top:1px solid var(--am-line); color:var(--am-dim); font-size:11px; }
#agentmux-layout .am-focus .am-layout { grid-template-columns:minmax(0,1fr); }
#agentmux-layout .am-focus .am-side { display:none; }
#agentmux-layout .am-focus .am-main { padding-left:32px; padding-right:32px; }
#agentmux-layout .am-notice { margin:10px 0 0; color:var(--am-green); font-size:12px; }
#agentmux-layout .am-diff { background:var(--am-panel); padding:12px; margin-top:16px; white-space:pre-wrap; overflow-wrap:anywhere; font:inherit; }
#agentmux-layout .am-inspect-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
#agentmux-layout .am-request { border-left:2px solid var(--am-yellow); padding:14px; margin-top:18px; background:var(--am-panel); }
#agentmux-layout .am-request pre { font:inherit; white-space:pre-wrap; overflow-wrap:anywhere; }
#agentmux-layout .am-request-actions { display:flex; gap:12px; margin-top:14px; flex-wrap:wrap; }
#agentmux-layout .am-inbox { color:var(--am-yellow); }
#agentmux-layout .am-mobile-close { display:none; }
#agentmux-layout [hidden] { display:none !important; }
@container (max-width:680px) {
 #agentmux-layout .am-layout { grid-template-columns:minmax(0,1fr); }
 #agentmux-layout .am-side { display:none; }
 #agentmux-layout .am-main, #agentmux-layout .am-focus .am-main { padding:18px 16px 12px; }
 #agentmux-layout .am-drawer .am-side { display:block; position:absolute; right:0; top:0; bottom:0; width:min(300px,90%); overflow-y:auto; z-index:2; }
 #agentmux-layout .am-mobile-close { display:block; margin-bottom:12px; }
 #agentmux-layout .am-path { display:none; }
 #agentmux-layout .am-top { gap:7px; padding:10px; }
 #agentmux-layout .am-top-actions { gap:2px; }
 #agentmux-layout .am-bottom .am-shortcuts { display:none; }
 #agentmux-layout .am-input-foot { font-size:11px; }
}
@media (pointer:coarse) { #agentmux-layout button { min-height:44px; } #agentmux-layout textarea { font-size:16px; } }
</style>
<div class="am-terminal">
 <header class="am-top">
  <span class="am-brand">agentmux</span><span class="am-path">/ agentmux / auth-fix</span>
  <div class="am-top-actions"><button class="am-inbox cursor-interaction" data-action="permission" aria-label="打开待处理请求">! 1 待处理</button><button class="cursor-interaction" data-action="focus" aria-pressed="false">专注</button><button class="cursor-interaction" data-action="sidebar" aria-label="切换协作侧栏">≡ 任务</button></div>
 </header>
 <div class="am-layout">
  <main class="am-main">
   <div class="am-title" data-slot="title">修复登录态刷新</div>
   <div class="am-subtitle"><span data-slot="agent">Claude Code</span><span class="am-tag" data-slot="state">◐ 运行中</span><span>auth-fix · 共享工作区</span></div>
   <div class="am-conversation" data-slot="content"></div>
   <div class="am-notice" data-slot="notice" role="status" aria-live="polite"></div>
   <div class="am-composer">
    <div class="am-recipient" data-slot="recipient">→ Claude Code / 修复登录态刷新</div>
    <div class="am-reference" data-slot="reference" hidden><span></span><button class="cursor-interaction" data-action="remove-ref" aria-label="移除引用">×</button></div>
    <textarea aria-label="当前 Agent 的任务草稿" placeholder="输入任务，/ 查看命令，@ 引用上下文…" rows="2"></textarea>
    <div class="am-input-foot"><span>Alt+Enter 换行 · / 命令</span><button class="am-send cursor-interaction" data-action="send">Enter 加入队列 ↵</button></div>
   </div>
  </main>
  <aside class="am-side" aria-label="工作区协作栏">
   <button class="am-mobile-close cursor-interaction" data-action="close-sidebar">← 返回对话</button>
   <nav class="am-tabs" aria-label="协作栏内容"><button class="cursor-interaction" data-tab="team" aria-pressed="true">协作</button><button class="cursor-interaction" data-tab="files" aria-pressed="false">改动</button><button class="cursor-interaction" data-tab="context" aria-pressed="false">上下文</button></nav>
   <div data-slot="sidebar"></div>
  </aside>
 </div>
 <footer class="am-bottom"><span>auth-fix · agentmux/auth-fix</span><span data-slot="counts">2 运行 · 1 待处理 · 1 完成</span><span class="am-shortcuts">Ctrl+P 任务 · Ctrl+B 侧栏</span></footer>
</div>
<script>
(() => {
 const root = document.getElementById('agentmux-layout');
 const terminal = root.querySelector('.am-terminal');
 const slot = name => root.querySelector('[data-slot="' + name + '"]');
 const editor = root.querySelector('textarea');
 const tasks = [
  {id:'claude',name:'Claude Code',title:'修复登录态刷新',state:'running',prompt:'修复登录过期后的刷新逻辑，保持现有接口不变。',reply:'问题出在并发请求各自刷新 token。我会复用进行中的刷新请求，并在完成后清理引用。',tool:'src/auth/session.ts'},
  {id:'codex',name:'Codex',title:'验证刷新边界',state:'waiting',prompt:'验证刷新失败、并发刷新和退出登录这几个边界。',reply:'测试用例已经准备好，需要运行认证测试来验证当前行为。',tool:'tests/auth.test.ts'},
  {id:'pi',name:'pi',title:'梳理认证调用链',state:'done',prompt:'梳理认证调用链，给负责修复的 Agent 一份简短结论。',reply:'已找到两条独立触发刷新的路径：请求拦截器和会话恢复。建议两处都复用 session.ts 中的同一个 promise。',tool:'docs/auth-flow.md'},
  {id:'opencode',name:'OpenCode',title:'补充回归测试',state:'running',prompt:'为登录态刷新补充回归测试，先覆盖多个请求同时返回 401 的场景。',reply:'我正在搭建并发请求测试，先固定 refresh endpoint 的调用次数，再验证请求重试结果。',tool:'tests/refresh.test.ts'}
 ];
 const states = {running:['◐','运行中','am-tag'],waiting:['!','待授权','am-tag'],done:['✓','已完成','am-plus'],ready:['○','就绪','am-muted']};
 let state = {selected:'claude',tab:'team',focus:false,view:'chat',file:'src/auth/session.ts'};
 const drafts = {}, refs = {}, queues = {}, sent = {};
 let approved = false, lastTask = 'claude';
 const esc = text => String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const current = () => tasks.find(t=>t.id===state.selected) || tasks[0];
 function restore(snapshot) {
  const s = snapshot?.privateContent;
  if(!s) return;
  if(tasks.some(t=>t.id===s.selected)) state.selected=s.selected;
  if(['team','files','context'].includes(s.tab)) state.tab=s.tab;
  state.focus=!!s.focus;
 }
 restore(window.openai?.widgetState);
 function save() {
  const api=window.openai;
  if(api?.setWidgetState) api.setWidgetState({modelContent:{layout:'主对话区 + 右侧协作栏',focus:state.focus},privateContent:{selected:state.selected,tab:state.tab,focus:state.focus}}).catch(()=>{});
 }
 const files = [
  {path:'src/auth/session.ts',delta:'+12 −4',by:'Claude Code',code:'@@ refreshSession()\n- return refreshToken()\n+ if (!pendingRefresh) {\n+   pendingRefresh = refreshToken()\n+     .finally(() => pendingRefresh = null)\n+ }\n+ return pendingRefresh'},
  {path:'tests/refresh.test.ts',delta:'+28',by:'OpenCode',code:'@@ concurrent refresh\n+ it("shares one refresh request", async () => {\n+   await Promise.all([request(), request()])\n+   expect(refresh).toHaveBeenCalledTimes(1)\n+ })'},
  {path:'docs/auth-flow.md',delta:'+16',by:'pi',code:'@@ authentication flow\n+ Request interceptor → refreshSession()\n+ Session restore → refreshSession()\n+ Share one in-flight refresh promise.'}
 ];
 function chat(t) {
  const extra=(sent[t.id]||[]).map(s=>'<div class="am-message am-you"><span class="am-author">you</span><p>'+esc(s)+'</p></div>').join('');
  return '<div class="am-message am-you"><span class="am-author">you</span><p>'+esc(t.prompt)+'</p></div>'+
   '<div class="am-message"><span class="am-author">'+esc(t.name)+'</span><p>'+esc(t.reply)+'</p></div>'+
   '<details class="am-tool"><summary class="cursor-interaction">✓ read　'+esc(t.tool)+'</summary><pre>已读取相关实现和调用位置。\n重点：并发触发、失败清理、退出登录。</pre></details>'+
   (t.id==='claude'?'<details class="am-tool" open><summary class="cursor-interaction">✓ edit　src/auth/session.ts　<span class="am-plus">+12</span> <span class="am-minus">−4</span></summary><pre><span class="am-minus">− return refreshToken()</span>\n<span class="am-plus">+ return pendingRefresh ??= refreshToken()</span></pre></details>':'')+
   (t.state==='waiting'?'<div class="am-working">! 此任务正在等待你的授权</div><button class="cursor-interaction" data-action="permission">查看请求 →</button>':t.state==='done'?'<div class="am-working am-plus">✓ 梳理完成</div><button class="cursor-interaction" data-action="relay">引用结论到修复任务 →</button>':'<div class="am-working">◐ '+(t.id==='claude'?'正在检查失败后的清理逻辑…':'正在编写并发测试…')+'</div>')+
   extra+'<div class="am-stream-foot"><span>'+(queues[t.id]?.length?'已排队 '+queues[t.id].length+' 条':'对话 · 跟随最新')+'</span><button class="cursor-interaction" data-action="changes">查看改动 →</button></div>';
 }
 function sidebar() {
  if(state.tab==='team') {
   slot('sidebar').innerHTML='<div class="am-section-label">▾ auth-fix <span class="am-muted">· 共享</span></div>'+tasks.map(t=>{
    const s=states[t.state];
    return '<button class="am-task cursor-interaction" data-task="'+t.id+'" aria-pressed="'+(state.selected===t.id)+'"><span class="am-task-title"><span class="'+s[2]+'">'+(state.selected===t.id?'›':s[0])+'</span>'+esc(t.title)+'</span><span class="am-task-sub">'+esc(t.name)+' · '+s[1]+(queues[t.id]?.length?' · '+queues[t.id].length+' 排队':'')+'</span></button>';
   }).join('')+(approved?'':'<div class="am-alert"><div class="am-section-label">需要你处理 · 1</div><button class="cursor-interaction" data-action="permission">! Codex 请求运行测试 →</button></div>')+'<div class="am-side-note">同一工作区，4 个 Agent<br>每条提示词只发送给当前任务。</div>';
  } else if(state.tab==='files') {
   slot('sidebar').innerHTML='<div class="am-section-label">工作区改动 · 3 个文件</div>'+files.map(f=>'<button class="am-file cursor-interaction" data-file="'+f.path+'">'+esc(f.path)+'<span>'+esc(f.delta)+' · '+esc(f.by)+' 涉及</span></button>').join('')+'<div class="am-side-note">选择文件查看 diff。<br>工作区改动由所有 Agent 共享。</div>';
  } else {
   slot('sidebar').innerHTML='<div class="am-context"><div class="am-section-label">工作区</div><p>auth-fix<br><span class="am-muted">agentmux/auth-fix</span></p><div class="am-section-label">共享约定</div><p>保持公开 API 不变。<br>刷新逻辑集中在 session.ts。<br>每个 Agent 维护自己的测试。</p><div class="am-section-label">上下文文件</div><p class="am-muted">.agentmux/context.md<br>.agentmux/activity.md</p><button class="cursor-interaction" data-task="pi">查看 pi 的调用链结论 →</button></div>';
  }
 }
 function render() {
  const t=current(), s=states[t.state];
  terminal.classList.toggle('am-focus',state.focus);
  root.querySelector('[data-action="focus"]').setAttribute('aria-pressed',String(state.focus));
  root.querySelector('[data-action="focus"]').textContent=state.focus?'恢复协作':'专注';
  slot('title').textContent=t.title; slot('agent').textContent=t.name; slot('state').textContent=s[0]+' '+s[1];
  slot('state').className=s[2]; slot('recipient').textContent='→ '+t.name+' / '+t.title;
  root.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===state.tab)));
  editor.value=drafts[t.id]||'';
  const ref=slot('reference'); ref.hidden=!refs[t.id]; ref.querySelector('span').textContent=refs[t.id]||'';
  root.querySelector('[data-action="send"]').textContent=t.state==='running'||t.state==='waiting'?'Enter 加入队列 ↵':'Enter 发送 ↵';
  root.querySelector('[data-action="permission"]').hidden=approved;
  const count = k=>tasks.filter(t=>t.state===k).length;
  slot('counts').textContent=count('running')+' 运行 · '+count('waiting')+' 待处理 · '+count('done')+' 完成';
  if(state.view==='diff') {
   const f=files.find(f=>f.path===state.file)||files[0];
   slot('content').innerHTML='<div class="am-inspect-head"><span class="am-author">'+esc(f.path)+'</span><button class="cursor-interaction" data-action="back">← 对话</button></div><div class="am-muted">工作区 diff · '+esc(f.delta)+'</div><pre class="am-diff">'+f.code.split('\n').map(l=>'<span class="'+(l[0]==='+'?'am-plus':l[0]==='-'?'am-minus':'am-muted')+'">'+esc(l)+'</span>').join('\n')+'</pre>';
  } else if(state.view==='permission'&&!approved) {
   slot('content').innerHTML='<div class="am-inspect-head"><span class="am-tag">待处理请求 · 1 / 1</span><button class="cursor-interaction" data-action="back">稍后处理</button></div><div class="am-request"><div class="am-author">Codex / 验证刷新边界</div><p>请求运行认证测试</p><pre>$ cargo test -p auth --test refresh\n\n工作区：auth-fix\n操作：运行命令</pre><div class="am-request-actions"><button class="cursor-interaction" data-decision="allow">[y] 允许一次</button><button class="cursor-interaction" data-decision="reject">[n] 拒绝</button></div></div>';
  } else slot('content').innerHTML=chat(t);
  sidebar();
 }
 function select(id) {
  drafts[state.selected]=editor.value;
  state.selected=id; state.view='chat';
  terminal.classList.remove('am-drawer'); slot('notice').textContent=''; render(); save();
 }
 function submit() {
  const text=editor.value.trim(); if(!text) return;
  if(text.startsWith('/')) {
   const commands={'/focus':'focus','/files':'changes','/tasks':'sidebar'};
   if(commands[text]) { drafts[state.selected]=''; action(commands[text]); editor.value=''; }
   else slot('notice').textContent='预览命令：/focus 专注 · /files 改动 · /tasks 任务';
   return;
  }
  const t=current();
  if(t.state==='running'||t.state==='waiting') {
   (queues[t.id]??=[]).push(text); slot('notice').textContent='已加入 '+t.name+' 的演示队列 · 当前轮结束后发送';
  } else {
   (sent[t.id]??=[]).push(text); slot('notice').textContent='已添加到 '+t.name+' 的本地演示对话';
  }
  drafts[t.id]=''; delete refs[t.id]; render();
 }
 function action(a) {
  if(a==='send') {submit();return;}
  drafts[state.selected]=editor.value;
  if(a==='focus') {state.focus=!state.focus;terminal.classList.remove('am-drawer');}
  if(a==='sidebar') {
   if(root.clientWidth<=680) terminal.classList.toggle('am-drawer');
   else state.focus=!state.focus;
  }
  if(a==='close-sidebar') terminal.classList.remove('am-drawer');
  if(a==='changes') {state.tab='files';state.view='diff';state.file=files.find(f=>f.by===current().name)?.path||files[0].path;}
  if(a==='back') {state.view='chat';}
  if(a==='permission'&&!approved) {state.view='permission';terminal.classList.remove('am-drawer');}
  if(a==='relay') {lastTask=state.selected;state.selected='claude';state.view='chat';refs.claude='↳ pi / 梳理认证调用链 · 结论';drafts.claude=drafts.claude||'请结合这份调用链结论继续修复。';slot('notice').textContent='已引用 '+tasks.find(t=>t.id===lastTask).name+' 的结论，等待你发送';}
  if(a==='remove-ref') delete refs[state.selected];
  render();save();
 }
 root.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.task) {select(b.dataset.task);return;}
  if(b.dataset.tab) {drafts[state.selected]=editor.value;state.tab=b.dataset.tab;render();save();return;}
  if(b.dataset.file) {drafts[state.selected]=editor.value;state.file=b.dataset.file;state.view='diff';terminal.classList.remove('am-drawer');render();return;}
  if(b.dataset.decision) {
   approved=true; tasks[1].state=b.dataset.decision==='allow'?'running':'ready';state.view='chat';
   slot('notice').textContent=b.dataset.decision==='allow'?'演示：已允许 Codex 运行测试':'演示：已拒绝该请求，Codex 等待新指令';render();return;
  }
  if(b.dataset.action) action(b.dataset.action);
 });
 editor.addEventListener('input',()=>{drafts[state.selected]=editor.value;});
 editor.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.isComposing) {e.preventDefault();if(e.altKey||e.shiftKey){const start=editor.selectionStart;editor.setRangeText('\n',start,editor.selectionEnd,'end');drafts[state.selected]=editor.value;}else submit();}
 });
 root.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key.toLowerCase()==='b'){e.preventDefault();action('sidebar');}
  if(e.key==='Escape'){terminal.classList.remove('am-drawer');if(state.view!=='chat'){state.view='chat';render();}}
 });
 window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
 render();
 if(globalThis.Tweak) {
  const options={sidebarWidth:270};
  const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--am-side',options.sidebarWidth+'px')});
  tweak.addSlider(options,'sidebarWidth',{label:'协作栏宽度',min:230,max:310,step:10,unit:'px'});
 }
})();
</script>
</div>
