[package]
name = "agentmux-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ratatui terminal client for the agentmux daemon: session list, event stream, prompt input"

[dependencies]
libc = "0.2"
# The TUI is a pure client of the daemon: domain types come from
# agentmux-core, all I/O goes through agentmux-client's DaemonClient.
agentmux-client = { path = "../client" }
agentmux-core = { path = "../core" }
chrono = { version = "0.4", features = ["serde"] }
# Version locked to ratatui's crossterm backend (ratatui-crossterm
# defaults to crossterm 0.29); `event-stream` enables async EventStream.
# On Unix, use the level-triggered poll backend: the default mio reader can
# strand unread input after a mouse-event burst exceeds its 1024-byte buffer.
crossterm = { version = "0.29", features = ["event-stream", "use-dev-tty"] }
futures-util = "0.3"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde_json = "1"
pulldown-cmark = "0.13"
tui-markdown = "0.3.10"
unicode-segmentation = "1"
unicode-width = "0.2"
nucleo-matcher = "0.3.1"
shell-words = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
